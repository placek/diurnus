<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#282828">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>GridDay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js" data-auto-replace-svg="nest"></script>
<style>
/* ───────────── Tokens (Gruvbox light / dark) ───────────── */
:root{
  color-scheme: light;
  --hourw: 48px;
  --hdr: 48px;
  --bg:#fbf1c7; --raise:#fffbe8; --fg:#3c3836; --fg-dim:#7c6f64; --fg-faint:#a89984;
  --line:rgba(60,56,54,.09); --line-2:rgba(60,56,54,.17);
  --past:rgba(60,56,54,.05);
  --on:#fbf1c7;
  --red:#9d0006; --green:#79740e; --yellow:#b57614; --blue:#076678;
  --purple:#8f3f71; --aqua:#427b58; --orange:#af3a03; --now:#cc241d;
  --shadow:0 14px 34px rgba(60,56,54,.18), 0 2px 6px rgba(60,56,54,.08);
  --sans:"IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#282828; --raise:#3c3836; --fg:#ebdbb2; --fg-dim:#a89984; --fg-faint:#7c6f64;
    --line:rgba(235,219,178,.07); --line-2:rgba(235,219,178,.14);
    --past:rgba(0,0,0,.2);
    --on:#1d2021;
    --red:#fb4934; --green:#b8bb26; --yellow:#fabd2f; --blue:#83a598;
    --purple:#d3869b; --aqua:#8ec07c; --orange:#fe8019; --now:#fb4934;
    --shadow:0 16px 40px rgba(0,0,0,.55), 0 2px 8px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#282828; --raise:#3c3836; --fg:#ebdbb2; --fg-dim:#a89984; --fg-faint:#7c6f64;
  --line:rgba(235,219,178,.07); --line-2:rgba(235,219,178,.14);
  --past:rgba(0,0,0,.2);
  --on:#1d2021;
  --red:#fb4934; --green:#b8bb26; --yellow:#fabd2f; --blue:#83a598;
  --purple:#d3869b; --aqua:#8ec07c; --orange:#fe8019; --now:#fb4934;
  --shadow:0 16px 40px rgba(0,0,0,.55), 0 2px 8px rgba(0,0,0,.3);
}

/* ───────────── Base ───────────── */
html{height:100%;background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  height:100%;margin:0;overflow:hidden;display:flex;flex-direction:column;
  background:var(--bg);color:var(--fg);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--fg-dim);outline-offset:2px}
.ic{display:inline-grid;place-items:center;line-height:1}
.ic svg{height:1em;width:auto;display:block}
.ltr{font:600 .8em var(--mono)}

/* ───────────── Header ───────────── */
#top{
  height:var(--hdr);flex:none;display:flex;align-items:center;gap:14px;
  padding:0 max(10px,env(safe-area-inset-right)) 0 max(10px,env(safe-area-inset-left));
  border-bottom:1px solid var(--line-2);
}
.nav,.tools{display:flex;align-items:center;gap:2px;flex:none}
.ib{
  width:32px;height:32px;border:0;border-radius:8px;background:transparent;color:var(--fg-dim);
  display:grid;place-items:center;cursor:pointer;font-size:13px;
}
.ib:hover{background:var(--line);color:var(--fg)}
#date{
  border:0;background:transparent;cursor:pointer;border-radius:8px;
  padding:6px 8px;font:500 14px var(--sans);white-space:nowrap;color:var(--fg);
}
#date:hover{background:var(--line)}
#date:not(.is-today){color:var(--yellow)}
.tokens{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:12px;cursor:default}
.pips{flex:1;min-width:0;max-width:440px;height:10px;display:flex;gap:3px}
.pip{flex:1;min-width:2px;display:flex;gap:1px}
.pip b{flex:1;border-radius:2px;background:var(--line-2)}
.pip b.d{background:var(--c)}
.pip b.p{background:color-mix(in srgb,var(--c) 32%,transparent)}
.count{font:500 13px var(--mono);color:var(--fg-faint);white-space:nowrap}
.count b{color:var(--fg);font-weight:600}
.count .pl{margin-left:6px}

/* ───────────── Grid: 16 rows × (label + 4 quanta) ───────────── */
#grid{
  flex:1;min-height:0;display:grid;grid-template-rows:repeat(var(--hours,16),minmax(0,1fr));
  padding:0 env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px);
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation;
}
.row{
  position:relative;min-height:0;display:grid;
  grid-template-columns:var(--hourw) repeat(4,minmax(0,1fr));grid-template-rows:minmax(0,1fr);
  border-top:1px solid var(--line);
}
.row:first-child{border-top:0}
.row.band-start{border-top-color:var(--line-2)}
.hour{
  grid-column:1;grid-row:1;position:relative;min-width:0;overflow:hidden;
  display:flex;flex-direction:column;justify-content:center;padding-left:11px;
  border-right:1px solid var(--line);
}
.hour::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--band);opacity:.5}
.hour .h{font:500 12px var(--mono);color:var(--fg-faint)}
.hour .bn{font:400 10px/1.1 var(--sans);color:var(--fg-faint);white-space:nowrap;margin-top:1px}
.row.is-now .hour .h{color:var(--now);font-weight:600}

.cell{grid-row:1;min-width:0;cursor:pointer;border-left:1px solid var(--line)}
.cell.q0{border-left:0}
.cell.q2{border-left-color:var(--line-2)}
.cell.c-past{background:var(--past)}
.cell.c-now{background:linear-gradient(90deg,var(--past) calc(var(--f) * 100%),transparent 0)}
@media (hover:hover){ .cell:hover{box-shadow:inset 0 0 0 999px color-mix(in srgb,var(--fg) 5%,transparent)} }

/* Blocks (a block may be split into segments across rows) */
.blk{
  grid-row:1;position:relative;z-index:2;min-width:0;margin:4px 3px;padding:0 8px;
  display:flex;align-items:center;gap:6px;overflow:hidden;white-space:nowrap;
  font:500 13px/1.1 var(--sans);cursor:pointer;
  border:1.5px solid transparent;
  transition:filter .15s, box-shadow .15s, opacity .15s;
}
.blk.first{border-top-left-radius:7px;border-bottom-left-radius:7px}
.blk.last{border-top-right-radius:7px;border-bottom-right-radius:7px}
.blk:not(.first){margin-left:0;border-left-width:0;padding-left:7px}
.blk:not(.last){margin-right:0;border-right-width:0}
.blk .ic{flex:none;font-size:11px}
.blk .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.blk .cd{flex:none;font:500 11px var(--mono);opacity:.8}
.blk .cont{opacity:.55}

.st-confirmed{background:var(--c);color:var(--on)}
.st-planned{background:color-mix(in srgb,var(--c) 13%,transparent);border-color:color-mix(in srgb,var(--c) 65%,transparent);color:var(--fg)}
.st-planned .ic,.st-suggested .ic{color:var(--c)}
.st-planned.stale{opacity:.5}
.st-suggested{background:transparent;border-style:dashed;border-color:color-mix(in srgb,var(--c) 75%,transparent);color:var(--fg-dim);opacity:.72}
.st-active{
  border-color:var(--c);color:var(--fg);
  background:linear-gradient(90deg,
    color-mix(in srgb,var(--c) 48%,transparent) calc(var(--p) * 100%),
    color-mix(in srgb,var(--c) 13%,transparent) 0);
}
.st-active .ic{color:var(--fg)}
.blk.hl{filter:brightness(1.07) saturate(1.08);box-shadow:0 3px 12px color-mix(in srgb,var(--c) 32%,transparent)}
.blk.hl.stale,.blk.hl.st-suggested{opacity:1}
.blk.ghost{z-index:3;pointer-events:none;border:1.5px dashed var(--fg-faint);background:color-mix(in srgb,var(--fg) 6%,transparent)}
.blk.ghost:not(.first){border-left-width:0}
.blk.ghost:not(.last){border-right-width:0}
.blk.nudge{animation:nudge .28s ease}
@keyframes nudge{25%{translate:-2px 0}75%{translate:2px 0}}

.kcur{grid-row:1;z-index:4;margin:2px 1px;border-radius:7px;box-shadow:0 0 0 2px var(--fg);pointer-events:none}

/* "Now" indicator */
.nowline{
  position:absolute;top:-1px;bottom:-1px;width:2px;margin-left:-1px;z-index:5;pointer-events:none;
  background:var(--now);border-radius:2px;
  box-shadow:0 0 6px var(--now),0 0 16px color-mix(in srgb,var(--now) 55%,transparent);
}
.nowline::before{
  content:"";position:absolute;top:-4px;left:50%;width:8px;height:8px;margin-left:-4px;border-radius:50%;
  background:var(--now);animation:pulse 2.2s infinite;
}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--now) 60%,transparent)}
  70%,100%{box-shadow:0 0 0 8px transparent}
}

/* ───────────── Radial menu ───────────── */
#scrim{position:fixed;inset:0;z-index:40;background:color-mix(in srgb,var(--bg) 25%,transparent)}
#scrim.strong{background:color-mix(in srgb,var(--bg) 60%,transparent)}
#radial{position:fixed;z-index:50;width:0;height:0}
.rc{
  position:absolute;width:66px;height:66px;margin:-33px 0 0 -33px;border-radius:50%;
  background:var(--raise);box-shadow:var(--shadow);
  display:flex;flex-direction:column;align-items:center;justify-content:center;animation:fade .15s;
}
.rt{font:600 12px var(--mono)}
.rl{font:400 11px var(--sans);color:var(--fg-dim);margin-top:1px;max-width:58px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rb{
  position:absolute;left:0;top:0;width:44px;height:44px;margin:-22px 0 0 -22px;border:0;border-radius:50%;
  display:grid;place-items:center;cursor:pointer;font-size:16px;
  background:var(--raise);color:var(--c);
  box-shadow:var(--shadow),inset 0 0 0 1.5px color-mix(in srgb,var(--c) 40%,transparent);
  transform:translate(var(--x),var(--y));
  animation:pop .24s cubic-bezier(.2,.9,.3,1.25) backwards;animation-delay:var(--d);
}
.rb:hover,.rb:focus-visible{background:var(--c);color:var(--on);outline:none}
@media (hover:none){ .rb .k{display:none} }
@keyframes pop{from{transform:translate(0,0) scale(.3);opacity:0}}
@keyframes fade{from{opacity:0;scale:.85}}

/* ───────────── Sheet (edit) & help ───────────── */
.card{
  position:fixed;z-index:60;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(360px,calc(100vw - 24px));max-height:calc(100% - 24px);overflow:auto;
  background:var(--raise);color:var(--fg);border-radius:14px;box-shadow:var(--shadow);
  padding:14px;animation:rise .18s ease-out;box-sizing:border-box;
}
@keyframes rise{from{opacity:0;translate:0 8px}}
@media (max-width:560px){
  .card{top:auto;bottom:calc(10px + env(safe-area-inset-bottom,0px));transform:translateX(-50%)}
}
.sh-head{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.sh-time{font:600 14px var(--mono)}
.chip{font:500 12px var(--sans);color:var(--fg-dim);border:1px solid var(--line-2);border-radius:99px;padding:2px 8px}
.sh-head .ib{margin-left:auto}
#ttl{
  width:100%;box-sizing:border-box;font:500 16px var(--sans);color:var(--fg);
  background:var(--bg);border:1.5px solid var(--line-2);border-radius:9px;padding:10px 11px;outline:none;
}
#ttl:focus{border-color:var(--c)}
.cats{display:flex;gap:6px;margin:12px 0 14px}
.cb{
  flex:1;height:40px;border:0;border-radius:9px;cursor:pointer;display:grid;place-items:center;font-size:15px;
  background:color-mix(in srgb,var(--c) 13%,transparent);color:var(--c);
}
.cb.sel{background:var(--c);color:var(--on)}
.sh-actions{display:flex;align-items:center;gap:8px}
.sp{flex:1}
.btn{
  display:inline-flex;align-items:center;gap:7px;border:0;border-radius:9px;padding:9px 13px;cursor:pointer;
  font:500 14px var(--sans);background:var(--line);color:var(--fg);
}
.btn:hover{background:var(--line-2)}
.btn.primary{background:var(--fg);color:var(--bg)}
.btn.danger{background:transparent;color:var(--red);padding-left:6px}
.btn.danger:hover{background:color-mix(in srgb,var(--red) 12%,transparent)}
.btn .ic{font-size:12px}

#helpbox{width:min(460px,calc(100vw - 24px))}
#helpbox h2{font:600 20px var(--sans);margin:2px 0 4px}
#helpbox p{margin:0 0 14px;color:var(--fg-dim);font-size:14px;line-height:1.45}
.legend{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:16px}
.legend .blk{margin:0;height:28px;border-radius:7px;--c:var(--blue);font-size:12px;cursor:default}
.keys{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:14px;margin:0 0 16px}
.keys dt{white-space:nowrap}
.keys dd{margin:0;color:var(--fg-dim)}
kbd{
  font:500 11px var(--mono);padding:2px 6px;border-radius:5px;background:var(--bg);
  box-shadow:inset 0 -1px 0 var(--line-2),0 0 0 1px var(--line-2);color:var(--fg);
}

/* ───────────── Toast ───────────── */
#toast{
  position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  translate:0 16px;opacity:0;pointer-events:none;z-index:70;
  display:flex;align-items:center;gap:14px;white-space:nowrap;
  background:var(--fg);color:var(--bg);font:500 14px var(--sans);padding:9px 16px;border-radius:99px;
  box-shadow:var(--shadow);transition:opacity .2s,translate .2s;
}
#toast.show{opacity:1;translate:0 0;pointer-events:auto}
#toast button{border:0;background:none;padding:0;cursor:pointer;font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* Radial: drugi pierścień */
.rb.has-kids::after{
  content:"";position:absolute;inset:-5px;border-radius:50%;pointer-events:none;
  border:1.5px dotted color-mix(in srgb,var(--c) 75%,transparent);
}
.rc.pick{border:0;cursor:pointer;color:var(--c);font:inherit;box-shadow:var(--shadow),inset 0 0 0 1.5px color-mix(in srgb,var(--c) 45%,transparent)}
.rc.pick .ic{font-size:16px;margin-bottom:2px}
.rc.pick:hover,.rc.pick:focus-visible{background:var(--c);color:var(--on);outline:none}
.rc.pick:hover .rl{color:var(--on)}
.rb .k,.rc .k{
  position:absolute;right:-3px;bottom:-3px;width:16px;height:16px;border-radius:50%;
  display:grid;place-items:center;font:600 9px var(--mono);
  background:var(--bg);color:var(--fg-dim);box-shadow:0 0 0 1px var(--line-2);
}
.rc .k{right:2px;bottom:2px}
@media (hover:none){ .rc .k{display:none} }

/* Arkusz edycji: podkategorie */
.subs{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 14px}
.sc{
  display:inline-flex;align-items:center;gap:6px;border:0;border-radius:99px;padding:6px 12px;cursor:pointer;
  font:500 14px var(--sans);background:color-mix(in srgb,var(--c) 12%,transparent);color:var(--fg);
}
.sc .ic{font-size:11px;color:var(--c)}
.sc.sel{background:var(--c);color:var(--on)}
.sc.sel .ic{color:var(--on)}

/* Edytor kategorii */
#cats{width:min(460px,calc(100vw - 24px))}
.ce-title{font:600 20px var(--sans)}
.ce-list{display:flex;flex-direction:column;gap:3px;margin-bottom:10px}
.ce-row{display:flex;align-items:center;gap:6px}
.ce-row.top:not(:first-child){margin-top:8px}
.ce-row.kid{margin-left:16px;padding-left:12px;border-left:2px solid color-mix(in srgb,var(--c) 40%,transparent)}
.ce-ic{
  flex:none;width:34px;height:34px;border:0;border-radius:9px;display:grid;place-items:center;cursor:pointer;
  font-size:14px;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c);
}
.ce-row.top .ce-ic{background:var(--c);color:var(--on)}
.ce-ic.inh{opacity:.45}
.ce-name{
  flex:1;min-width:0;font:500 16px var(--sans);color:var(--fg);background:transparent;
  border:1.5px solid transparent;border-radius:8px;padding:6px 8px;outline:none;
}
.ce-row.kid .ce-name{font-size:15px}
.ce-name:hover{border-color:var(--line-2)}
.ce-name:focus{border-color:var(--c);background:var(--bg)}
.ce-sw{
  flex:none;width:18px;height:18px;margin:0 5px;border:0;border-radius:50%;cursor:pointer;background:var(--c);
  box-shadow:0 0 0 2px var(--raise),0 0 0 3.5px color-mix(in srgb,var(--c) 45%,transparent);
}
.ce-row .ib{width:28px;height:28px;font-size:12px}
.ce-gap{flex:none;width:28px}
.ce-row .ib:disabled{opacity:.3;cursor:default}
.ce-row .ib.del:hover{color:var(--red)}
.ce-panel{display:flex;flex-wrap:wrap;gap:3px;padding:8px;margin:3px 0 6px 40px;border-radius:10px;background:var(--bg)}
.ce-panel.kidp{margin-left:68px}
.ce-panel button{
  width:32px;height:32px;border:0;border-radius:8px;display:grid;place-items:center;cursor:pointer;
  background:transparent;color:var(--fg-dim);font-size:13px;
}
.ce-panel button:hover{background:var(--line-2);color:var(--fg)}
.ce-panel button.sel{background:var(--c);color:var(--on)}
.ce-panel .sw{width:28px;height:28px;border-radius:50%;background:var(--sc);margin:2px}
.ce-panel .sw:hover{background:var(--sc);transform:scale(1.1)}
.ce-panel .sw.sel{background:var(--sc);box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--sc)}
.ce-add{width:100%;justify-content:center;margin:2px 0 14px;background:transparent;color:var(--fg-dim);border:1.5px dashed var(--line-2)}
.ce-add:hover{color:var(--fg)}
.ce-add:disabled{opacity:.4;cursor:default}

/* Ustawienia: zakładki + dzień */
.tabs{display:flex;gap:2px;padding:3px;border-radius:10px;background:var(--bg)}
.tab{border:0;background:transparent;border-radius:8px;padding:6px 14px;cursor:pointer;font:600 15px var(--sans);color:var(--fg-dim)}
.tab:hover{color:var(--fg)}
.tab.sel{background:var(--raise);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.cfg-sel{
  font:500 15px var(--mono);color:var(--fg);background:var(--bg);cursor:pointer;
  border:1.5px solid var(--line-2);border-radius:8px;padding:6px 8px;outline:none;
}
.cfg-sel:focus{border-color:var(--fg-dim)}
.dy-range{display:flex;align-items:flex-end;gap:10px;margin:2px 0 14px}
.dy-f{display:flex;flex-direction:column;gap:4px;font:400 13px var(--sans);color:var(--fg-dim)}
.dy-dash{padding-bottom:8px;color:var(--fg-faint)}
.dy-sum{margin-left:auto;padding-bottom:9px;font:400 14px var(--sans);color:var(--fg-dim);white-space:nowrap}
.dp{display:flex;height:36px;border-radius:9px;overflow:hidden;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line-2)}
.dp-seg{
  min-width:0;display:flex;align-items:center;padding:0 8px;overflow:hidden;
  background:color-mix(in srgb,var(--c) 22%,transparent);border-left:3px solid var(--c);
  font:500 14px var(--sans);color:var(--fg);
}
.dp-seg span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dp-seg.none{background:transparent;border-left:0}
.dp-ax{position:relative;height:14px;margin:4px 0 18px;font:500 10px var(--mono);color:var(--fg-faint)}
.dp-ax span{position:absolute;top:0;translate:-50% 0}
.dp-ax span:first-child{translate:0 0}
.dp-ax span:last-child{translate:-100% 0}
.dy-h{font:600 16px var(--sans);margin:0 0 4px}
.ce-row.band .ce-sw{margin-left:8px}
.dy-from{display:flex;align-items:center;gap:6px;font:400 14px var(--sans);color:var(--fg-dim)}
.dy-from .cfg-sel{font-size:14px;padding:5px 6px}
.ce-row.out{opacity:.45}
.ce-row.dup .cfg-sel{border-color:var(--red)}
.linkbtn{
  border:0;background:none;padding:0;margin:0 0 14px;cursor:pointer;
  font:400 14px var(--sans);color:var(--fg-dim);text-decoration:underline;text-underline-offset:3px;
}
.linkbtn:hover{color:var(--fg)}

[hidden]{display:none !important}

/* ───────────── Responsive ───────────── */
@media (max-width:560px){
  :root{--hourw:38px}
  #top{gap:8px}
  #date{font-size:13px;padding:6px 4px}
  .hour{padding-left:8px}
  .hour .h{font-size:11px}
  .hour .bn{display:none}
  .blk{margin:3px 2px;padding:0 6px;gap:5px;font-size:12px}
  #top{position:relative}
  .pips{position:absolute;left:0;right:0;bottom:-1px;height:3px;max-width:none;gap:1px}
  .pip b{border-radius:0}
  .count .pl{display:none}
  .legend{grid-template-columns:repeat(2,1fr)}
}
@media (hover:none) and (pointer:coarse){ .keys .kb{display:none} }

  .blk{margin-top:2px;margin-bottom:2px}
  .hour .bn{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before{animation:none !important;transition:none !important}
}
</style>
</head>
<body>

<header id="top">
  <div class="nav">
    <button class="ib" id="prev" aria-label="Poprzedni dzień" title="Poprzedni dzień  [">‹</button>
    <button id="date" title="Wróć do dziś  T"></button>
    <button class="ib" id="next" aria-label="Następny dzień" title="Następny dzień  ]">›</button>
  </div>
  <div class="tokens" id="tokens">
    <div class="pips" id="pips"></div>
    <div class="count" id="count"></div>
  </div>
  <div class="tools">
    <button class="ib" id="suggest" aria-label="Sugestie z zeszłego tygodnia" title="Sugestie z zeszłego tygodnia  S"></button>
    <button class="ib" id="catsbtn" aria-label="Ustawienia" title="Ustawienia: kategorie C, dzień D"></button>
    <button class="ib" id="theme" aria-label="Motyw"></button>
    <button class="ib" id="helpbtn" aria-label="Pomoc" title="Pomoc  ?"></button>
  </div>
</header>

<main id="grid"></main>

<div id="scrim" hidden></div>
<div id="radial" hidden></div>
<div id="sheet" class="card" hidden role="dialog" aria-label="Edycja bloku"></div>
<div id="cats" class="card" hidden role="dialog" aria-label="Ustawienia"></div>
<div id="helpbox" class="card" hidden role="dialog" aria-label="Pomoc"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/*
  GridDay — tygodnie 1–2: silnik siatki + interakcje + localStorage.

  PWA: przy self-hostingu połóż obok plik sw.js:
    const C='gridday-v1';
    self.addEventListener('install',e=>e.waitUntil(caches.open(C).then(c=>c.addAll(['./']))));
    self.addEventListener('fetch',e=>e.respondWith(
      caches.match(e.request).then(r=>r||fetch(e.request).then(res=>{
        const cp=res.clone(); caches.open(C).then(c=>c.put(e.request,cp)); return res;}))));
  Rejestracja poniżej uruchamia się tylko poza hostingiem Claude.
*/
(() => {
'use strict';

/* ───────────── Stałe ───────────── */
const QDAY = 96;            // kwanty 15 min w dobie; bloki trzymają q liczone od północy
let START_H = 6, END_H = 22, HOURS = 16, Q0 = 24, Q1 = 88, BANDS = [];   // widoczne okno dnia (z ustawień)
const KEY = 'gridday.v1', PREF = 'gridday.prefs';
const DEFAULT_CATS = [          // parent: null = kategoria główna; kolor dziedziczą podkategorie
  { id:'work',   name:'Praca',     icon:'laptop-code',   color:'yellow', parent:null },
  { id:'work-a', name:'Projekt A', icon:null,            parent:'work' },
  { id:'pray',   name:'Modlitwa',  icon:'hands-praying', color:'purple', parent:null },
  { id:'pray-j', name:'Jutrznia',  icon:'sun',           parent:'pray' },
  { id:'pray-t', name:'Tercja',    icon:null,            parent:'pray' },
  { id:'learn',  name:'Nauka',     icon:'book-open',     color:'blue',   parent:null },
  { id:'move',   name:'Ruch',      icon:'dumbbell',      color:'green',  parent:null },
  { id:'home',   name:'Dom',       icon:'house',         color:'orange', parent:null },
  { id:'home-g', name:'Ogród',     icon:'seedling',      parent:'home' },
  { id:'rest',   name:'Odpoczynek',icon:'mug-hot',       color:'aqua',   parent:null },
];
const COLORS = ['yellow','orange','red','purple','blue','aqua','green'];
const ICONS = ['circle','star','hands-praying','church','cross','book-bible','sun','moon','laptop-code','briefcase',
  'code','book-open','graduation-cap','pen-nib','brain','dumbbell','person-running','bicycle','mountain','house',
  'seedling','broom','utensils','hammer','mug-hot','bed','music','guitar','gamepad','film','users','child','heart',
  'phone','envelope','cart-shopping','car','list-check'];
const MAX_TOP = 9, MAX_KIDS = 9;   // cyfry 1–9
const DEFAULT_DAY = { start:6, end:22, bands:[      // pora trwa do początku następnej
  { id:'b-rano',  name:'Rano',  from:6,  color:'aqua'   },
  { id:'b-praca', name:'Praca', from:8,  color:'yellow' },
  { id:'b-dom',   name:'Dom',   from:16, color:'orange' },
  { id:'b-cisza', name:'Cisza', from:20, color:'purple' },
]};
const STATUS_LABEL = { suggested:'sugestia', planned:'plan', active:'w toku', confirmed:'wykonane', discarded:'odrzucone' };
const MODE_LABEL = { past:'wstecz', now:'start', future:'plan' };

/* ───────────── Narzędzia ───────────── */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const clamp01 = x => Math.min(1, Math.max(0, x));
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36);
const fmtNum = x => Number.isInteger(x) ? String(x) : String(x).replace('.', ',');
const fmtDur = m => m < 60 ? `${m} min` : `${Math.floor(m/60)} h${m % 60 ? ' ' + (m % 60) + ' min' : ''}`;
const plural = (n, one, few, many) =>
  n === 1 ? one : (n%10>=2 && n%10<=4 && (n%100<12 || n%100>14)) ? few : many;
const fmtDate = new Intl.DateTimeFormat('pl-PL', { weekday:'short', day:'numeric', month:'short' });
const finePointer = matchMedia('(pointer: fine)').matches;

function lsGet(k, fb){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch { return fb; } }
function lsSet(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } }

/* Daty: dzień jako 'YYYY-MM-DD' w czasie lokalnym, kwant q ∈ [0,64) od 06:00 */
const dayKey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => dayKey(new Date());
const splitDay = k => k.split('-').map(Number);
function qTime(day, q){ const [y,m,d] = splitDay(day); return new Date(y, m-1, d, 0, q*15).getTime(); }
function shiftDay(day, n){ const [y,m,d] = splitDay(day); return dayKey(new Date(y, m-1, d+n)); }
function fmtQ(day, q){ if (q >= QDAY) return '24:00'; const t = new Date(qTime(day, q)); return pad(t.getHours()) + ':' + pad(t.getMinutes()); }
function rel(day, q0, q1){
  const now = Date.now(), a = qTime(day, q0), b = qTime(day, q1);
  return b <= now ? 'past' : a > now ? 'future' : 'now';
}
function nowQ(){
  if (viewDay !== today()) return null;
  const now = Date.now();
  for (let q = Q0; q < Q1; q++) if (now >= qTime(viewDay, q) && now < qTime(viewDay, q+1)) return q;
  return null;
}

/* Ikony: API FontAwesome → <i> (observer FA) → litera */
const iconCache = {};
function icon(name, fb = ''){
  const key = name + '|' + fb;
  if (iconCache[key]) return iconCache[key];
  let h = '';
  const FA = window.FontAwesome;
  try {
    if (FA && FA.icon && FA.findIconDefinition){
      const def = FA.findIconDefinition({ prefix:'fas', iconName:name });
      const r = def && FA.icon(def);
      if (r && r.html) h = r.html.join('');
    }
  } catch {}
  if (!h) h = FA ? `<i class="fa-solid fa-${name}"></i>` : `<span class="ltr">${esc(fb)}</span>`;
  return (iconCache[key] = `<span class="ic" aria-hidden="true">${h}</span>`);
}

/* ───────────── Stan ───────────── */
function normalize(x){
  if (x && x.v === 1 && Array.isArray(x.blocks)){ x.blocks.forEach(b => { b.q += 24; }); x.v = 2; }  // v1: q od 06:00
  if (!x || x.v !== 2 || !Array.isArray(x.blocks)) x = { v:2, cats:DEFAULT_CATS, blocks:[] };
  if (!Array.isArray(x.cats) || !x.cats.length) x.cats = DEFAULT_CATS;
  if (!x.day || !(x.day.start < x.day.end) || !Array.isArray(x.day.bands)) x.day = JSON.parse(JSON.stringify(DEFAULT_DAY));
  return x;
}
/* jednorazowe przeniesienie stanu z poprzedniej nazwy aplikacji (semigrid → gridday) */
try {
  for (const [from, to] of [['semigrid.v1', KEY], ['semigrid.prefs', PREF]]){
    const v = localStorage.getItem(from);
    if (v !== null && localStorage.getItem(to) === null){ localStorage.setItem(to, v); localStorage.removeItem(from); }
  }
} catch {}

let S = normalize(lsGet(KEY, null));
let prefs = Object.assign({ theme:'auto', seenHelp:false }, lsGet(PREF, {}));

let viewDay = today();
let menu = null;            // { q, fit, rel }
let edit = null;            // { id, cat }
let catEdit = null;         // { draft, orig, panel }
let cursor = { q:0, visible:false };
let hover = null;
const hist = [];

const save = () => { if (!lsSet(KEY, S)) toast('Zapis nieudany: localStorage niedostępny'); };
const savePrefs = () => lsSet(PREF, prefs);
const byId = id => S.blocks.find(b => b.id === id);
const catOf = id => S.cats.find(c => c.id === id) || { id, name:'—', icon:'circle', color:'fg-faint', parent:null };
const topCats = () => S.cats.filter(c => !c.parent && !c.archived);
const kids = id => S.cats.filter(c => c.parent === id && !c.archived);
const rootOf = c => (c.parent && S.cats.find(x => x.id === c.parent)) || c;
const colorOf = c => rootOf(c).color || 'fg-faint';
const iconOf = c => c.icon || rootOf(c).icon || 'circle';
const pathOf = c => c.parent ? `${rootOf(c).name} › ${c.name}` : c.name;
function catOrder(){
  const m = new Map(); let i = 0;
  for (const t of S.cats.filter(c => !c.parent)){ m.set(t.id, i++); for (const k of S.cats.filter(c => c.parent === t.id)) m.set(k.id, i++); }
  return m;
}
function bandAt(bands, h){ let r = null; for (const b of bands) if (b.from <= h) r = b; return r; }   // bands posortowane
const bandOf = h => bandAt(BANDS, h);
function applyDay(){
  START_H = S.day.start; END_H = S.day.end; HOURS = END_H - START_H; Q0 = START_H * 4; Q1 = END_H * 4;
  BANDS = S.day.bands.slice().sort((a, b) => a.from - b.from);
  const g = $('#grid');
  g.style.setProperty('--hours', HOURS);
  g.setAttribute('aria-label', `Siatka dnia ${pad(START_H)}–${pad(END_H)}`);
  cursor.q = Math.min(Q1 - 1, Math.max(Q0, cursor.q));
}
const dayBlocks = day => S.blocks.filter(b => b.day === day && b.status !== 'discarded');

function occ(day, except){
  const o = new Array(QDAY).fill(null);
  for (const b of dayBlocks(day)) if (b.id !== except)
    for (let i = b.q; i < b.q + b.len && i < QDAY; i++) o[i] = b;
  return o;
}
/* Kwantowanie kliknięcia do klocka 30 min: [q,q+1], w razie kolizji [q-1,q], ostatecznie 15 min */
function fit(day, q){
  const o = occ(day);
  if (o[q]) return null;
  if (q + 1 < Q1 && !o[q+1]) return { q, len:2 };
  if (q - 1 >= Q0 && !o[q-1]) return { q:q-1, len:2 };
  return { q, len:1 };
}
/* Status docelowy przy akceptacji: zależny od położenia bloku względem TERAZ */
function acceptTarget(b){
  const r = rel(b.day, b.q, b.q + b.len);
  return r === 'past' ? 'confirmed' : r === 'now' ? 'active' : 'planned';
}
function stopOtherActive(exceptId){
  for (const x of S.blocks) if (x.status === 'active' && x.id !== exceptId) x.status = 'confirmed';
}

/* Mutacje z historią (Ctrl+Z) */
function commit(fn, msg, undoable = false){
  hist.push(JSON.stringify({ blocks:S.blocks, cats:S.cats, day:S.day })); if (hist.length > 80) hist.shift();
  fn(); save(); render();
  if (msg) toast(msg, undoable);
}
function undo(){
  const h = hist.pop();
  if (!h){ toast('Brak zmian do cofnięcia'); return; }
  const o = JSON.parse(h); S.blocks = o.blocks; S.cats = o.cats; S.day = o.day || S.day;
  applyDay(); save(); render(); toast('Cofnięto');
}

/* ───────────── Akcje ───────────── */
function createAt(q, catId){
  const f = fit(viewDay, q); if (!f) return;
  const r = rel(viewDay, q, q + 1);
  const status = r === 'past' ? 'confirmed' : r === 'now' ? 'active' : 'planned';
  const id = uid();
  commit(() => {
    if (status === 'active') stopOtherActive(id);
    S.blocks.push({ id, day:viewDay, q:f.q, len:f.len, cat:catId, title:'', status, created:Date.now() });
  }, status === 'active' ? `Start: do ${fmtQ(viewDay, f.q + f.len)}` : null);
}
function advance(b){
  if (b.status === 'suggested' || b.status === 'planned'){
    const ns = acceptTarget(b);
    if (ns !== b.status){
      commit(() => { if (ns === 'active') stopOtherActive(b.id); b.status = ns; });
      return;
    }
  }
  nudge(b.id);
}
function removeBlock(id){
  const b = byId(id); if (!b) return;
  commit(() => {
    if (b.status === 'suggested') b.status = 'discarded';   // zapamiętaj odrzuconą sugestię
    else S.blocks = S.blocks.filter(x => x.id !== id);
  }, b.status === 'suggested' ? 'Sugestia odrzucona' : 'Blok usunięty', true);
}
function suggestFromLastWeek(){
  const src = shiftDay(viewDay, -7);
  const srcBlocks = S.blocks.filter(b => b.day === src && b.status === 'confirmed');
  if (!srcBlocks.length){ toast('Tydzień temu nie ma potwierdzonych bloków'); return; }
  const o = occ(viewDay);
  const discarded = S.blocks.filter(b => b.day === viewDay && b.status === 'discarded');
  const add = [];
  for (const s of srcBlocks){
    let free = true;
    for (let i = s.q; i < s.q + s.len; i++) if (o[i]) free = false;
    if (!free || s.q < Q0 || s.q + s.len > Q1 || discarded.some(d => d.q === s.q && d.cat === s.cat)) continue;
    const nb = { id:uid(), day:viewDay, q:s.q, len:s.len, cat:s.cat, title:s.title || '', status:'suggested', created:Date.now() };
    add.push(nb);
    for (let i = s.q; i < s.q + s.len; i++) o[i] = nb;
  }
  if (!add.length){ toast('Brak wolnych miejsc na sugestie'); return; }
  commit(() => S.blocks.push(...add),
    `Dodano ${add.length} ${plural(add.length, 'sugestię', 'sugestie', 'sugestii')}`, true);
}
function assignDigit(n){
  const cat = topCats()[n - 1]; if (!cat) return;
  const q = cursor.visible ? cursor.q : nowQ();
  if (q == null){ toast('Użyj strzałek, aby wskazać pole'); return; }
  const b = occ(viewDay)[q];
  if (b){ if (b.cat !== cat.id) commit(() => { b.cat = cat.id; }); return; }
  if (kids(cat.id).length){ const [x, y] = cellCenter(q); if (x != null) openMenu(q, x, y, cat.id); return; }
  createAt(q, cat.id);
}
function cellCenter(q){
  const cell = $(`#grid .cell[data-q="${q}"]`); if (!cell) return [null, null];
  const r = cell.getBoundingClientRect();
  return [r.left + r.width / 2, r.top + r.height / 2];
}
function actAt(q){
  const b = occ(viewDay)[q];
  if (b){ advance(b); return; }
  const [x, y] = cellCenter(q); if (x != null) openMenu(q, x, y);
}
function nudge(id){
  document.querySelectorAll(`#grid .blk[data-id="${id}"]`).forEach(el => {
    el.classList.remove('nudge'); void el.offsetWidth; el.classList.add('nudge');
  });
}
function goDay(d){ viewDay = d; closeAll(); render(); }

/* ───────────── Render ───────────── */
function segHTML(h, a, e, cls, attrs, inner, style){
  const rs = h * 4, s0 = Math.max(a, rs), s1 = Math.min(e, rs + 4);
  if (s0 >= s1) return '';
  const first = s0 === a, last = s1 === e;
  return `<div class="${cls}${first ? ' first' : ''}${last ? ' last' : ''}" ${attrs} data-s0="${s0}" data-s1="${s1}"
    style="grid-column:${s0 - rs + 2}/span ${s1 - s0};${style}">${inner(first)}</div>`;
}
function blockHTML(b, h, now){
  const cat = catOf(b.cat), a = b.q, e = b.q + b.len;
  const rs = h * 4, s0 = Math.max(a, rs), s1 = Math.min(e, rs + 4);
  if (s0 >= s1) return '';
  const stale = b.status === 'planned' && rel(b.day, a, e) === 'past';
  const p = b.status === 'active' ? clamp01((now - qTime(b.day, s0)) / (qTime(b.day, s1) - qTime(b.day, s0))) : 0;
  const tip = `${fmtQ(b.day, a)}–${fmtQ(b.day, e)}  ${pathOf(cat)}${b.title ? ': ' + b.title : ''} (${STATUS_LABEL[b.status]})`;
  const cls = `blk st-${b.status}${stale ? ' stale' : ''}${hover === b.id ? ' hl' : ''}`;
  const ic = icon(iconOf(cat), cat.name[0]);
  return segHTML(h, a, e, cls, `data-id="${b.id}" title="${esc(tip)}"`,
    first => first
      ? `${ic}<span class="t">${esc(b.title || cat.name)}</span>${b.status === 'active' ? `<span class="cd" data-cd="${b.id}"></span>` : ''}`
      : `<span class="cont">${ic}</span>`,
    `--c:var(--${colorOf(cat)});--p:${p.toFixed(4)}`);
}

function render(){
  const now = Date.now();
  const blocks = dayBlocks(viewDay);
  let html = '';
  for (let r = 0; r < HOURS; r++){
    const h = START_H + r, band = bandOf(h), bandStart = !!band && (band.from === h || r === 0);
    let row = '', isNow = false, nowLeft = 0;
    for (let c = 0; c < 4; c++){
      const q = h * 4 + c, rr = rel(viewDay, q, q + 1);
      let style = `grid-column:${c + 2}`;
      if (rr === 'now'){
        const f = (now - qTime(viewDay, q)) / (qTime(viewDay, q + 1) - qTime(viewDay, q));
        style += `;--f:${f.toFixed(4)}`; isNow = true; nowLeft = (c + f) / 4;
      }
      row += `<div class="cell q${c} c-${rr}" data-q="${q}" style="${style}"></div>`;
    }
    if (menu && menu.fit) row += segHTML(h, menu.fit.q, menu.fit.q + menu.fit.len, 'blk ghost', '', () => '', '');
    for (const b of blocks) row += blockHTML(b, h, now);
    if (cursor.visible && Math.floor(cursor.q / 4) === h)
      row += `<div class="kcur" style="grid-column:${cursor.q % 4 + 2}"></div>`;
    if (isNow)
      row += `<div class="nowline" style="left:calc(var(--hourw) + (100% - var(--hourw)) * ${nowLeft.toFixed(4)})"></div>`;
    html += `<div class="row${isNow ? ' is-now' : ''}${bandStart && r ? ' band-start' : ''}" style="--band:${band ? `var(--${band.color})` : 'transparent'}">
      <div class="hour"><span class="h">${pad(h)}</span>${bandStart && band.name ? `<span class="bn">${esc(band.name)}</span>` : ''}</div>${row}</div>`;
  }
  $('#grid').innerHTML = html;
  renderHeader();
  live();
}

function renderHeader(){
  const [y,m,d] = splitDay(viewDay);
  const dateEl = $('#date');
  dateEl.textContent = fmtDate.format(new Date(y, m-1, d)).replace(',', '');
  dateEl.classList.toggle('is-today', viewDay === today());

  const order = catOrder();
  const bl = dayBlocks(viewDay).slice()
    .sort((a, b) => (order.get(a.cat) ?? 999) - (order.get(b.cat) ?? 999) || a.q - b.q);
  const done = [], plan = [], perCat = new Map();   // root.name → { q, kids: Map }
  for (const b of bl){
    const c = catOf(b.cat), col = `var(--${colorOf(c)})`;
    const isDone = b.status === 'confirmed' || b.status === 'active';
    let vis = 0;                                     // tylko kwanty w widocznym oknie dnia
    for (let i = b.q; i < b.q + b.len; i++) if (i >= Q0 && i < Q1){ (isDone ? done : plan).push(col); vis++; }
    if (isDone && vis){
      const root = rootOf(c);
      const e = perCat.get(root.name) || { q:0, kids:new Map() };
      e.q += vis;
      if (c.parent) e.kids.set(c.name, (e.kids.get(c.name) || 0) + vis);
      perCat.set(root.name, e);
    }
  }
  const NQ = HOURS * 4;
  const cells = [...done.map(c => ['d', c]), ...plan.map(c => ['p', c])].slice(0, NQ);
  while (cells.length < NQ) cells.push(['', '']);
  let pips = '';
  for (let i = 0; i < NQ; i += 2)
    pips += '<span class="pip">' + [cells[i], cells[i+1]]
      .map(([k, c]) => `<b class="${k}"${c ? ` style="--c:${c}"` : ''}></b>`).join('') + '</span>';
  $('#pips').innerHTML = pips;
  $('#count').innerHTML = `<b>${fmtNum(done.length / 2)}</b>/${HOURS * 2}${plan.length ? `<span class="pl">+${fmtNum(plan.length / 2)} w planie</span>` : ''}`;
  $('#tokens').title = perCat.size
    ? [...perCat].map(([n, e]) => `${n}: ${fmtDur(e.q * 15)}` +
        (e.kids.size ? ` (${[...e.kids].map(([k, q]) => `${k} ${fmtDur(q * 15)}`).join(', ')})` : '')).join('\n')
    : 'Brak wykonanych slotów';
}

/* Aktualizacje co sekundę: odliczanie i postęp aktywnego bloku */
function live(){
  const now = Date.now();
  let title = 'GridDay';
  document.querySelectorAll('#grid .blk.st-active').forEach(el => {
    const b = byId(el.dataset.id); if (!b) return;
    const t0 = qTime(b.day, +el.dataset.s0), t1 = qTime(b.day, +el.dataset.s1);
    el.style.setProperty('--p', clamp01((now - t0) / (t1 - t0)).toFixed(4));
  });
  document.querySelectorAll('#grid [data-cd]').forEach(el => {
    const b = byId(el.dataset.cd); if (!b) return;
    const left = Math.max(0, qTime(b.day, b.q + b.len) - now);
    const txt = `${Math.floor(left / 60000)}:${pad(Math.floor(left / 1000) % 60)}`;
    el.textContent = txt;
    title = `${txt}  ${b.title || catOf(b.cat).name}`;
  });
  if (document.title !== title) document.title = title;
}

/* ───────────── Menu radialne ───────────── */
function openMenu(q, x, y, level = null){
  closeAll(true);
  if (!topCats().length){ openCats(); return; }
  const f = fit(viewDay, q); if (!f) return;
  menu = { q, fit:f, rel:rel(viewDay, q, q + 1), level, x, y, label:'' };
  renderRadial();
  $('#radial').hidden = false; $('#scrim').hidden = false;
  render();
}
const ringR = n => Math.max(innerWidth < 420 ? 60 : 66, n * 52 / (2 * Math.PI));
function renderRadial(){
  const lvl = menu.level, items = lvl ? kids(lvl) : topCats();
  const R = ringR(items.length), m = R + 30;
  const x = Math.min(Math.max(menu.x, m), innerWidth - m);
  const y = Math.min(Math.max(menu.y, m + 8), innerHeight - m);
  let h;
  if (lvl){
    const p = catOf(lvl); menu.label = p.name;
    h = `<button class="rc pick" data-pick="${p.id}" style="--c:var(--${colorOf(p)})" aria-label="${esc(p.name)} ogólnie">
      ${icon(iconOf(p), p.name[0])}<div class="rl" id="rl">${esc(p.name)}</div><span class="k">0</span></button>`;
  } else {
    menu.label = MODE_LABEL[menu.rel];
    h = `<div class="rc"><div class="rt">${fmtQ(viewDay, menu.fit.q)}</div><div class="rl" id="rl">${menu.label}</div></div>`;
  }
  items.forEach((c, i) => {
    const a = -Math.PI / 2 + i * 2 * Math.PI / items.length;
    h += `<button class="rb${!lvl && kids(c.id).length ? ' has-kids' : ''}" data-cat="${c.id}" aria-label="${esc(c.name)}"
      style="--x:${(Math.cos(a) * R).toFixed(1)}px;--y:${(Math.sin(a) * R).toFixed(1)}px;--c:var(--${colorOf(c)});--d:${i * 16}ms">
      ${icon(iconOf(c), c.name[0])}<span class="k">${i + 1}</span></button>`;
  });
  const el = $('#radial');
  el.innerHTML = h; el.style.left = x + 'px'; el.style.top = y + 'px';
}
/* Kategoria z dziećmi otwiera drugi pierścień; środek drugiego pierścienia = kategoria ogólnie */
function choose(id){
  if (!menu) return;
  if (!menu.level && kids(id).length){ menu.level = id; renderRadial(); return; }
  pick(id);
}
function pick(catId){
  const q = menu.q;
  menu = null; $('#radial').hidden = true; $('#scrim').hidden = true;
  createAt(q, catId);
}

const dAlive = c => !c._del && !c.archived;
const dGet = id => catEdit.draft.find(c => c.id === id);
const dTop = () => catEdit.draft.filter(c => !c.parent && dAlive(c));
const dKids = id => catEdit.draft.filter(c => c.parent === id && dAlive(c));

function renderCats(focusId){

/* Zakładka „Dzień”: zakres godzin + pory dnia (pora trwa do początku następnej) */
const hourOpts = (from, to, sel) => { let o = ''; for (let h = from; h <= to; h++) o += `<option value="${h}"${h === sel ? ' selected' : ''}>${pad(h)}:00</option>`; return o; };
const sortedBands = () => catEdit.day.bands.slice().sort((a, b) => a.from - b.from);
function previewHTML(){
  const D = catEdit.day, bands = sortedBands(), hrs = D.end - D.start;
  let segs = '', h = D.start;
  while (h < D.end){
    const b = bandAt(bands, h); let e = h + 1;
    while (e < D.end && bandAt(bands, e) === b) e++;
    segs += `<div class="dp-seg${b ? '' : ' none'}" style="flex:${e - h};${b ? `--c:var(--${b.color})` : ''}"
      title="${pad(h)}–${pad(e)}${b && b.name ? '  ' + esc(b.name) : ''}"><span>${b ? esc(b.name) : ''}</span></div>`;
    h = e;
  }
  const step = hrs > 16 ? 4 : hrs > 8 ? 2 : 1;
  let ax = '';
  for (let x = D.start; x <= D.end; x++)
    if ((x - D.start) % step === 0 || x === D.end)
      if (x === D.end || D.end - x >= step / 2 || x === D.start)
        ax += `<span style="left:${((x - D.start) / hrs * 100).toFixed(2)}%">${pad(x)}</span>`;
  return `<div id="dprev"><div class="dp">${segs}</div><div class="dp-ax">${ax}</div></div>`;
}
function renderDay(focusSel){
  const D = catEdit.day, hrs = D.end - D.start, bands = sortedBands();
  const count = {}; bands.forEach(b => { count[b.from] = (count[b.from] || 0) + 1; });
  let rows = '';
  bands.forEach((b, i) => {
    const next = bands[i + 1];
    const visible = Math.max(b.from, D.start) < Math.min(next ? next.from : 24, D.end);
    rows += `<div class="ce-row band${visible ? '' : ' out'}${count[b.from] > 1 ? ' dup' : ''}" data-bid="${b.id}" style="--c:var(--${b.color})"
        ${visible ? '' : 'title="Poza zakresem dnia"'}>
      <button class="ce-sw" data-act="bcolor" title="Kolor" aria-label="Kolor"></button>
      <input class="ce-name" data-bid="${b.id}" value="${esc(b.name)}" placeholder="Nazwa pory dnia" maxlength="24">
      <label class="dy-from">od <select class="cfg-sel" data-bfrom="${b.id}">${hourOpts(0, 23, b.from)}</select></label>
      <button class="ib del" data-act="bdel" title="Usuń" aria-label="Usuń">${icon('trash-can', '×')}</button>
    </div>` + (catEdit.bpanel === b.id ? `<div class="ce-panel" style="--c:var(--${b.color});margin-left:8px">${COLORS.map(col =>
      `<button class="sw${col === b.color ? ' sel' : ''}" data-act="bsetcolor" data-color="${col}" style="--sc:var(--${col})" aria-label="${col}"></button>`).join('')}</div>` : '');
  });
  const h = cfgHead() + `
    <div class="dy-range">
      <label class="dy-f">Początek<select class="cfg-sel" data-f="start">${hourOpts(0, 23, D.start)}</select></label>
      <span class="dy-dash">–</span>
      <label class="dy-f">Koniec<select class="cfg-sel" data-f="end">${hourOpts(D.start + 1, 24, D.end)}</select></label>
      <span class="dy-sum">${hrs} h, ${hrs * 2} ${plural(hrs * 2, 'slot', 'sloty', 'slotów')}</span>
    </div>
    ${previewHTML()}
    <div class="dy-h">Pory dnia</div>
    <div class="ce-list">${rows}</div>
    <button class="btn ce-add" data-act="badd">${icon('plus', '+')}Nowa pora dnia</button>
    <button class="linkbtn" data-act="dreset">Przywróć domyślne 06–22</button>` + cfgFoot();
  setCfgHTML(h, focusSel);
}
function moveUp(c){
  const d = catEdit.draft;
  const sib = d.filter(x => (x.parent || null) === (c.parent || null) && dAlive(x));
  const i = sib.indexOf(c); if (i <= 0) return;
  const prev = sib[i - 1];
  const group = d.filter(x => x === c || x.parent === c.id);     // główna kategoria jedzie z dziećmi
  const rest = d.filter(x => !group.includes(x));
  rest.splice(rest.indexOf(prev), 0, ...group);
  catEdit.draft = rest;
}
function buildCats(){
  const d = catEdit.draft, orig = catEdit.orig;
  const origMap = new Map(S.cats.map(c => [c.id, c]));
  const used = new Set(S.blocks.filter(b => b.status !== 'discarded').map(b => b.cat));
  const del = new Set();
  for (const c of d) if (c._del || (!(c.name || '').trim() && !orig.has(c.id))) del.add(c.id);
  for (const c of d) if (c.parent && del.has(c.parent)) del.add(c.id);
  const out = [];
  for (const c of d){
    const clean = { id:c.id, name:(c.name || '').trim() || origMap.get(c.id)?.name || '—', icon:c.icon || null, parent:c.parent || null };
    if (!clean.parent) clean.color = c.color || 'yellow';
    if (c.archived) clean.archived = true;
    if (del.has(c.id)){
      // używana w historii → archiwizuj (znika z menu, stare bloki zachowują kolor); nieużywana → usuń
      const inUse = used.has(c.id) || (!c.parent && d.some(k => k.parent === c.id && used.has(k.id)));
      if (!inUse) continue;
      clean.archived = true;
    }
    out.push(clean);
  }
  if (!out.some(c => !c.parent && !c.archived)){ toast('Zostaw co najmniej jedną kategorię'); return null; }
  return out;
}
function saveCfg(){
  const cats = buildCats();
  if (!cats){ if (catEdit.tab !== 'cats'){ catEdit.tab = 'cats'; renderCats(); } return; }
  const D = catEdit.day, froms = D.bands.map(b => b.from);
  if (new Set(froms).size !== froms.length){
    toast('Dwie pory dnia zaczynają się o tej samej godzinie');
    if (catEdit.tab !== 'day'){ catEdit.tab = 'day'; renderCats(); }
    return;
  }
  const day = { start:D.start, end:D.end,
    bands:sortedBands().map(b => ({ id:b.id, name:(b.name || '').trim(), from:b.from, color:b.color })) };
  closeAll();
  commit(() => { S.cats = cats; S.day = day; applyDay(); }, 'Ustawienia zapisane', true);
}
$('#cats').addEventListener('input', e => {
  const inp = e.target.closest('.ce-name');
  if (!inp || !catEdit) return;
  if (inp.dataset.bid){
    const b = catEdit.day.bands.find(x => x.id === inp.dataset.bid);
    if (b){ b.name = inp.value; $('#dprev').outerHTML = previewHTML(); }
  } else { const c = dGet(inp.dataset.id); if (c) c.name = inp.value; }
});
$('#cats').addEventListener('change', e => {
  const sel = e.target.closest('select'); if (!sel || !catEdit) return;
  const D = catEdit.day, v = +sel.value;
  if (sel.dataset.f === 'start'){ D.start = v; if (D.end <= v) D.end = v + 1; }
  else if (sel.dataset.f === 'end') D.end = v;
  else if (sel.dataset.bfrom){ const b = D.bands.find(x => x.id === sel.dataset.bfrom); if (b) b.from = v; }
  renderDay();
});
$('#cats').addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (!a || !catEdit) return;
  const act = a.dataset.act, row = a.closest('.ce-row'), id = row && row.dataset.id, c = id && dGet(id);
  const P = catEdit.panel;
  switch (act){
    case 'close': closeAll(); break;
    case 'save': saveCfg(); break;
    case 'tab': catEdit.tab = a.dataset.tab; catEdit.panel = null; catEdit.bpanel = null; renderCats(); break;
    case 'bcolor': { const bid = a.closest('[data-bid]').dataset.bid; catEdit.bpanel = catEdit.bpanel === bid ? null : bid; renderDay(); break; }
    case 'bsetcolor': { const b = catEdit.day.bands.find(x => x.id === catEdit.bpanel); if (b) b.color = a.dataset.color; catEdit.bpanel = null; renderDay(); break; }
    case 'bdel': { const bid = a.closest('[data-bid]').dataset.bid; catEdit.day.bands = catEdit.day.bands.filter(x => x.id !== bid); renderDay(); break; }
    case 'badd': {
      const D = catEdit.day, taken = new Set(D.bands.map(b => b.from)), usedCol = new Set(D.bands.map(b => b.color));
      let from = D.start; while (from < D.end - 1 && taken.has(from)) from++;
      const nb = { id:uid(), name:'', from, color:COLORS.find(x => !usedCol.has(x)) || COLORS[0] };
      D.bands.push(nb); renderDay(`.ce-name[data-bid="${nb.id}"]`); break;
    }
    case 'dreset': catEdit.day = JSON.parse(JSON.stringify(DEFAULT_DAY)); catEdit.bpanel = null; renderDay(); break;
    case 'icon': case 'color':
      catEdit.panel = (P && P.id === id && P.kind === act) ? null : { id, kind:act };
      renderCats(); break;
    case 'seticon': dGet(P.id).icon = a.dataset.icon || null; catEdit.panel = null; renderCats(); break;
    case 'setcolor': dGet(P.id).color = a.dataset.color; catEdit.panel = null; renderCats(); break;
    case 'up': moveUp(c); renderCats(); break;
    case 'addtop': {
      const usedCol = new Set(dTop().map(t => t.color));
      const nc = { id:uid(), name:'', icon:'circle', color:COLORS.find(x => !usedCol.has(x)) || COLORS[0], parent:null };
      catEdit.draft.push(nc); catEdit.panel = null; renderCats(nc.id); break;
    }
    case 'addkid': {
      const nk = { id:uid(), name:'', icon:null, parent:id };
      const dd = catEdit.draft; let at = dd.indexOf(c);
      dd.forEach((x, i) => { if (x.parent === id) at = Math.max(at, i); });
      dd.splice(at + 1, 0, nk); catEdit.panel = null; renderCats(nk.id); break;
    }
    case 'del':
      c._del = true;
      if (!c.parent) catEdit.draft.forEach(x => { if (x.parent === c.id) x._del = true; });
      if (P && P.id === id) catEdit.panel = null;
      renderCats(); break;
  }
});

    <p>Kategoria z podkategoriami ma kropkowaną obwódkę i otwiera drugi pierścień. Środek drugiego pierścienia wybiera samą kategorię nadrzędną. Kategorie, zakres dnia i pory dnia zmienisz w ustawieniach (suwaki w nagłówku).</p>
    <dl class="keys">
      <dt>Klik w blok</dt><dd>potwierdź plan lub przyjmij sugestię</dd>
      <dt>Dwuklik, przytrzymanie</dt><dd>edytuj nazwę, kategorię, usuń</dd>
      <dt class="kb"><kbd>←</kbd> <kbd>↑</kbd> <kbd>↓</kbd> <kbd>→</kbd> lub <kbd>hjkl</kbd></dt><dd class="kb">kursor; <kbd>Enter</kbd> akcja, <kbd>E</kbd> edycja, <kbd>Del</kbd> usuń</dd>
      <dt class="kb"><kbd>1</kbd>–<kbd>${topCats().length}</kbd></dt><dd class="kb">kategoria w polu kursora; bez kursora startuje bieżący slot</dd>
      <dt class="kb"><kbd>0</kbd> <kbd>⌫</kbd></dt><dd class="kb">w drugim pierścieniu: kategoria nadrzędna, powrót</dd>
      <dt class="kb"><kbd>C</kbd> <kbd>D</kbd></dt><dd class="kb">ustawienia: kategorie, dzień</dd>
      <dt class="kb"><kbd>[</kbd> <kbd>]</kbd> <kbd>T</kbd></dt><dd class="kb">poprzedni dzień, następny, dziś</dd>
      <dt class="kb"><kbd>S</kbd></dt><dd class="kb">sugestie z tego samego dnia tydzień temu</dd>
      <dt class="kb"><kbd>Ctrl</kbd> <kbd>Z</kbd></dt><dd class="kb">cofnij</dd>
    </dl>
    <div class="sh-actions"><span class="sp"></span><button class="btn primary" data-act="close">Zaczynam</button></div>`;
  el.hidden = false;
  $('#scrim').hidden = false; $('#scrim').classList.add('strong');
}

function closeAll(silent){
  const hadMenu = !!menu;
  if (silent) $('#toast').classList.remove('show');
  menu = null; edit = null;
  $('#radial').hidden = true; $('#radial').innerHTML = '';
  catEdit = null;
  $('#sheet').hidden = true; $('#helpbox').hidden = true; $('#cats').hidden = true;
  $('#scrim').hidden = true; $('#scrim').classList.remove('strong');
  if (hadMenu && !silent) render();
}

/* ───────────── Toast ───────────── */
let toastT;
function toast(msg, undoable){
  const el = $('#toast');
  el.innerHTML = `<span>${esc(msg)}</span>${undoable ? '<button data-undo>Cofnij</button>' : ''}`;
  el.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => el.classList.remove('show'), 3600);
}
$('#toast').addEventListener('click', e => { if (e.target.closest('[data-undo]')) undo(); });

/* ───────────── Motyw ───────────── */
function applyTheme(){
  const t = prefs.theme, root = document.documentElement;
  if (t === 'auto') delete root.dataset.theme; else root.dataset.theme = t;
  const dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.querySelector('meta[name="theme-color"]').content = dark ? '#282828' : '#fbf1c7';
  $('#theme').title = 'Motyw: ' + { auto:'systemowy', dark:'ciemny', light:'jasny' }[t];
}

/* ───────────── Zdarzenia: wskaźnik ───────────── */
const grid = $('#grid');
let pressT = null, pressXY = null, suppress = false, clickT = null, clickId = null;

grid.addEventListener('pointerdown', e => {
  suppress = false;
  const blk = e.target.closest('.blk[data-id]');
  if (!blk) return;
  const id = blk.dataset.id;
  pressXY = [e.clientX, e.clientY];
  clearTimeout(pressT);
  pressT = setTimeout(() => {
    pressT = null; suppress = true;
    if (navigator.vibrate) navigator.vibrate(8);
    openEdit(id);
  }, 480);
});
grid.addEventListener('pointermove', e => {
  if (pressT && pressXY && Math.hypot(e.clientX - pressXY[0], e.clientY - pressXY[1]) > 8){
    clearTimeout(pressT); pressT = null;
  }
});
['pointerup', 'pointercancel'].forEach(t => grid.addEventListener(t, () => { clearTimeout(pressT); pressT = null; }));

grid.addEventListener('click', e => {
  if (suppress){ suppress = false; return; }
  if (cursor.visible){ cursor.visible = false; }
  const blk = e.target.closest('.blk[data-id]');
  if (blk){
    const id = blk.dataset.id;
    if (clickT && clickId === id){ clearTimeout(clickT); clickT = null; openEdit(id); return; }
    clearTimeout(clickT); clickId = id;
    clickT = setTimeout(() => { clickT = null; const b = byId(id); if (b) advance(b); }, 240);
    return;
  }
  const cell = e.target.closest('.cell');
  if (cell) openMenu(+cell.dataset.q, e.clientX, e.clientY);
});
grid.addEventListener('contextmenu', e => {
  const blk = e.target.closest('.blk[data-id]');
  if (blk){ e.preventDefault(); openEdit(blk.dataset.id); }
});

/* Wspólne podświetlenie segmentów bloku rozciętego na dwa wiersze */
function setHover(id){
  if (hover) grid.querySelectorAll(`.blk[data-id="${hover}"]`).forEach(x => x.classList.remove('hl'));
  hover = id;
  if (id) grid.querySelectorAll(`.blk[data-id="${id}"]`).forEach(x => x.classList.add('hl'));
}
grid.addEventListener('pointerover', e => {
  if (e.pointerType === 'touch') return;
  const blk = e.target.closest('.blk[data-id]');
  const id = blk ? blk.dataset.id : null;
  if (id !== hover) setHover(id);
});
grid.addEventListener('pointerleave', () => { clearTimeout(pressT); pressT = null; setHover(null); });

$('#scrim').addEventListener('click', () => closeAll());
$('#radial').addEventListener('click', e => {
  if (!menu) return;
  const pk = e.target.closest('[data-pick]'); if (pk){ pick(pk.dataset.pick); return; }
  const b = e.target.closest('.rb'); if (b) choose(b.dataset.cat);
});
$('#radial').addEventListener('pointerover', e => {
  const b = e.target.closest('.rb'), rl = $('#rl');
  if (rl && menu) rl.textContent = b ? catOf(b.dataset.cat).name : menu.label;
});
$('#sheet').addEventListener('click', e => {
  const cb = e.target.closest('.cb, .sc'); if (cb){ setEditCat(cb.dataset.cat); return; }
  const a = e.target.closest('[data-act]'); if (!a || !edit) return;
  const act = a.dataset.act;
  if (act === 'close') closeAll();
  else if (act === 'ok') saveEdit();
  else if (act === 'status') saveEdit({ status:a.dataset.status });
  else if (act === 'del'){ const id = edit.id; closeAll(); removeBlock(id); }
});
$('#helpbox').addEventListener('click', e => { if (e.target.closest('[data-act="close"]')) closeAll(); });

$('#prev').addEventListener('click', () => goDay(shiftDay(viewDay, -1)));
$('#next').addEventListener('click', () => goDay(shiftDay(viewDay, 1)));
$('#date').addEventListener('click', () => goDay(today()));
$('#suggest').addEventListener('click', suggestFromLastWeek);
$('#catsbtn').addEventListener('click', openCats);
$('#helpbtn').addEventListener('click', openHelp);
$('#theme').addEventListener('click', () => {
  prefs.theme = { auto:'dark', dark:'light', light:'auto' }[prefs.theme] || 'auto';
  savePrefs(); applyTheme();
});

/* ───────────── Zdarzenia: klawiatura ───────────── */
const MOVES = { ArrowLeft:-1, h:-1, ArrowRight:1, l:1, ArrowUp:-4, k:-4, ArrowDown:4, j:4 };
document.addEventListener('keydown', e => {
  const k = e.key;
  if (e.target.matches('input')){
    if (k === 'Escape') closeAll();
    else if (k === 'Enter'){
      e.preventDefault();
      if (e.target.id === 'ttl') saveEdit(); else e.target.blur();
    }
    return;
  }
  if ((e.ctrlKey || e.metaKey) && k.toLowerCase() === 'z'){ e.preventDefault(); undo(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (k === 'Escape'){ closeAll(); return; }
  const n = /^[1-9]$/.test(k) ? +k : 0;

  if (menu){
    const items = menu.level ? kids(menu.level) : topCats();
    if (n && items[n - 1]) choose(items[n - 1].id);
    else if (menu.level && (k === '0' || k === 'Enter')) pick(menu.level);
    else if (menu.level && k === 'Backspace'){ menu.level = null; renderRadial(); }
    return;
  }
  if (catEdit) return;
  if (edit){
    const tops = topCats();
    if (n && tops[n - 1]) setEditCat(tops[n - 1].id);
    else if (k === 'Enter'){ e.preventDefault(); saveEdit(); }
    return;
  }
  if (!$('#helpbox').hidden){ if (k === 'Enter' || k === '?') closeAll(); return; }

  if (k in MOVES){
    e.preventDefault();
    if (!cursor.visible){ cursor.visible = true; cursor.q = nowQ() ?? cursor.q; }
    else cursor.q = Math.min(Q1 - 1, Math.max(Q0, cursor.q + MOVES[k]));
    render(); return;
  }
  if (n){ assignDigit(n); return; }
  const lk = k.toLowerCase();
  if ((k === 'Enter' || k === ' ') && cursor.visible){ e.preventDefault(); actAt(cursor.q); }
  else if (lk === 'e' && cursor.visible){ const b = occ(viewDay)[cursor.q]; if (b) openEdit(b.id); }
  else if ((k === 'Delete' || k === 'Backspace') && cursor.visible){ const b = occ(viewDay)[cursor.q]; if (b) removeBlock(b.id); }
  else if (k === '[' || k === ',') goDay(shiftDay(viewDay, -1));
  else if (k === ']' || k === '.') goDay(shiftDay(viewDay, 1));
  else if (lk === 't') goDay(today());
  else if (lk === 's') suggestFromLastWeek();
  else if (lk === 'c') openCfg('cats');
  else if (lk === 'd') openCfg('day');
  else if (k === '?') openHelp();
});

/* ───────────── Zegar ───────────── */
let lastMinute = -1, lastToday = today();
function tick(){
  const now = Date.now(), t = today();
  if (t !== lastToday){ if (viewDay === lastToday) viewDay = t; lastToday = t; lastMinute = -1; }
  let changed = false;
  for (const b of S.blocks)
    if (b.status === 'active' && qTime(b.day, b.q + b.len) <= now){ b.status = 'confirmed'; changed = true; }
  if (changed) save();
  const m = Math.floor(now / 60000);
  if (changed || m !== lastMinute){ lastMinute = m; render(); }   // wskaźnik TERAZ: co minutę
  else live();                                                      // odliczanie: co sekundę
}

/* ───────────── Start ───────────── */
applyDay();
cursor.q = nowQ() ?? Q0;
save();                                   // utrwala ewentualną migrację v1 → v2
$('#suggest').innerHTML = icon('wand-magic-sparkles', 'S');
$('#theme').innerHTML = icon('circle-half-stroke', '◐');
$('#catsbtn').innerHTML = icon('sliders', 'U');
$('#helpbtn').innerHTML = icon('keyboard', '?');
$('#prev').innerHTML = icon('chevron-left', '‹');
$('#next').innerHTML = icon('chevron-right', '›');
applyTheme();
tick();
setInterval(tick, 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden){ lastMinute = -1; tick(); } });
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', applyTheme);
addEventListener('resize', () => { if (menu) closeAll(); });
addEventListener('storage', e => { if (e.key === KEY){ S = normalize(lsGet(KEY, S)); applyDay(); render(); } });   // synchronizacja kart
if (!prefs.seenHelp){ openHelp(); prefs.seenHelp = true; savePrefs(); }

if ('serviceWorker' in navigator && location.protocol === 'https:' && !/claude/.test(location.hostname))
  navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
