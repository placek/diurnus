name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Typy i testy idą PRZED budową: statyczny hosting nie ma wycofania
      # innego niż kolejne wdrożenie, więc to jedyny moment, w którym zła
      # wersja da się jeszcze zatrzymać.
      - run: npm run check
      - run: npm run test

      # Baza wynika z nazwy repozytorium: przy publikacji projektowej strona
      # stoi pod /<repo>/, a wpisana na sztywno ścieżka po zmianie nazwy
      # dałaby pustą stronę i 404 na zasobach — bez śladu w logach budowy.
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
